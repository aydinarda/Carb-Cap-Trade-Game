name: Load test (full session)

# Manual only — drives a full 3-mode game (grandfathering → benchmarking →
# auctioning + 25 bots) with 100 simulated players against the deployed backend.
# You can join in a browser with the room code the run prints in its logs.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Backend URL to hit
        default: https://carb-cap-trade-api.onrender.com
        required: true
      frontend_url:
        description: Frontend URL (optional — shown in the "join now" hint)
        default: ''
        required: false
      modes:
        description: Which cap mechanism(s) to play
        type: choice
        default: all
        required: true
        options:
          - all
          - grandfathering
          - benchmarking
          - auctioning
      bots:
        description: Market bots — 'default' keeps grandfathering bot-free, 'on'/'off' forces both ways
        type: choice
        default: default
        required: false
        options:
          - default
          - 'on'
          - 'off'
      n_players:
        description: Simulated players
        default: '100'
        required: true
      years_per_mode:
        description: Years played per cap mode
        default: '3'
        required: true
      round_window:
        description: Trade window (seconds per year)
        default: '25'
        required: true
      join_grace:
        description: Grace window to join in a browser before year 1 (seconds) — applies to each of the 3 modes
        default: '90'
        required: true
      # Calibration knobs. Blank = whatever shared/config/defaults.ts ships, which is what
      # you want for a plain load test; set them to reproduce a candidate from
      # sim/sweeps/price-calibration.ipynb against the real server.
      penalty_rate:
        description: 'penaltyRate (blank = shipped default)'
        default: ''
        required: false
      auction_cap_ratio:
        description: 'auctionCapRatio — auction supply as a multiple of class baseline (blank = shipped)'
        default: ''
        required: false
      cap_reduction_factor:
        description: 'capReductionFactor — yearly tightening; 0.97 ships, ~0.86 tracks the fall in need'
        default: ''
        required: false
      benchmark_stringency:
        description: 'benchmark as a fraction of sector average (1.119 ships)'
        default: ''
        required: false
      # Market-maker target inventory, escalating per round. A maker bids the GAP between its
      # target and its holdings, so a flat target is filled in round one and bid at zero ever
      # after — measured, it takes 18% of the pool in year one and 0-2% afterwards. Growing
      # the target keeps a gap for it to bid into. Step 0 = flat, i.e. today's behaviour.
      mm_inv_start:
        description: 'Market maker target inventory, year 1 (share of credits in circulation)'
        default: '0.18'
        required: false
      mm_inv_step:
        description: 'Market maker target increase per round (0 = flat)'
        default: '0.03'
        required: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node must be set up FIRST: pnpm 11 needs Node 22+ (it uses node:sqlite), and
      # pnpm/action-setup runs pnpm under whatever Node is active.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full-session load test
        env:
          # Set a repo secret HOST_KEY to match the backend; falls back to admin123.
          HOST_KEY: ${{ secrets.HOST_KEY || 'admin123' }}
          BASE_URL: ${{ inputs.base_url }}
          FRONTEND_URL: ${{ inputs.frontend_url }}
          N_PLAYERS: ${{ inputs.n_players }}
          YEARS_PER_MODE: ${{ inputs.years_per_mode }}
          ROUND_WINDOW: ${{ inputs.round_window }}
          JOIN_GRACE: ${{ inputs.join_grace }}
          MODES: ${{ inputs.modes }}
          BOTS: ${{ inputs.bots == 'default' && '' || inputs.bots }}
          PENALTY_RATE: ${{ inputs.penalty_rate }}
          AUCTION_CAP_RATIO: ${{ inputs.auction_cap_ratio }}
          CAP_REDUCTION_FACTOR: ${{ inputs.cap_reduction_factor }}
          BENCHMARK_STRINGENCY: ${{ inputs.benchmark_stringency }}
          MM_INV_START: ${{ inputs.mm_inv_start }}
          MM_INV_STEP: ${{ inputs.mm_inv_step }}
        run: node scripts/load-full-session.mjs
